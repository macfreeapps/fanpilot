name: FanPilot
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.fanpilot
packages:
  FanCore:
    path: Packages/FanCore
targets:
  FanPilot:
    type: application
    platform: macOS
    sources:
      - path: FanPilot
    resources:
      - path: FanPilot/Assets.xcassets
      - path: FanPilot/Info.plist
        buildPhase: none
    dependencies:
      - package: FanCore
        product: FanCore
      - target: FanPilotHelper
    postCompileScripts:
      - name: Embed FanPilot privileged helper
        script: |
          set -e
          APP="$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Library/LaunchDaemons"
          cp "$BUILT_PRODUCTS_DIR/FanPilotHelper" "$APP/Contents/MacOS/FanPilotHelper"
          cp "$SRCROOT/FanPilotHelper/com.fanpilot.helper.plist" "$APP/Contents/Library/LaunchDaemons/com.fanpilot.helper.plist"
          cp "$SRCROOT/FanPilotHelper/com.fanpilot.helper.legacy.plist" "$APP/Contents/Library/LaunchDaemons/com.fanpilot.helper.legacy.plist"
          chmod 755 "$APP/Contents/MacOS/FanPilotHelper"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/FanPilotHelper
          - $(SRCROOT)/FanPilotHelper/com.fanpilot.helper.plist
          - $(SRCROOT)/FanPilotHelper/com.fanpilot.helper.legacy.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/MacOS/FanPilotHelper
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Library/LaunchDaemons/com.fanpilot.helper.plist
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Library/LaunchDaemons/com.fanpilot.helper.legacy.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fanpilot.app
        PRODUCT_NAME: FanPilot
        INFOPLIST_FILE: FanPilot/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        CODE_SIGN_ENTITLEMENTS: FanPilot/FanPilot.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: YUVK5PXJXH
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
  FanPilotHelper:
    type: tool
    platform: macOS
    sources:
      - path: FanPilotHelper
        excludes:
          - com.fanpilot.helper.plist
    dependencies:
      - package: FanCore
        product: FanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fanpilot.helper
        PRODUCT_NAME: FanPilotHelper
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: YUVK5PXJXH
        ENABLE_APP_SANDBOX: NO
        INSTALL_PATH: /usr/local/bin
        ENABLE_HARDENED_RUNTIME: YES
