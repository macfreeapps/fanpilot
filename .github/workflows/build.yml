name: Build
# Manual trigger only: this has been verified locally (Xcode 27) but not yet on a hosted runner.
# Once a run on GitHub is green, add `push:` and `pull_request:` triggers here.
on:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test core
        run: swift test --package-path Packages/FanCore
      - name: Build app and helper (unsigned)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project FanPilot.xcodeproj -scheme FanPilot -configuration Release -derivedDataPath .build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
